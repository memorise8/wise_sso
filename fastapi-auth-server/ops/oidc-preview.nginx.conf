pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 4443 ssl;
        server_name localhost;
        ssl_certificate /preview-tls/cert.pem;
        ssl_certificate_key /preview-tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Cache-Control "no-store" always;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "same-origin" always;
        location = / {
            return 302 "/oauth2/authorize?response_type=code&client_id=oidc-local-preview&redirect_uri=https%3A%2F%2Flocalhost%3A4443%2Fcallback&scope=openid%20profile%20email&state=synthetic-preview-state&nonce=synthetic-preview-nonce&code_challenge=bGjhPneznZcMJBN16o1PrX-F3omXSTqJoSLgYX8N_w4&code_challenge_method=S256";
        }
        location = /callback {
            default_type text/plain;
            return 200 "OIDC callback received. This preview does not exchange the authorization code. Do not share the callback URL.\n";
        }
        location / {
            proxy_pass http://app-fastapi-dev:4001;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

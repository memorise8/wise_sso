# Overlay on docker-compose.dev.yml; synthetic, loopback-only preview.
services:
  app-fastapi-dev:
    environment:
      OIDC_ENABLED: "true"
      OIDC_PUBLIC_ORIGIN: https://localhost:4443
      OIDC_CLIENTS_JSON: >-
        [{"clientId":"oidc-local-preview","redirectUris":["https://localhost:4443/callback"],"clientSecretHash":"$$argon2id$$v=19$$m=19456,t=2,p=1$$Y7rJWHZ+4BD3kB9UGOXNdg$$YMBeoaLD2+SA7JW7RbQjCv4+2QAnimgF9QV79dSK5+s","requiredRoles":[{"serviceKey":"gitlab","name":"user"}],"groupsServiceKeys":["gitlab"],"requirePkce":true,"allowedScopes":["openid","profile","email"]},{"clientId":"gitlab-temis","redirectUris":["https://git.temis.me/users/auth/openid_connect/callback"],"clientSecretHash":"$$argon2id$$v=19$$m=19456,t=2,p=1$$Y7rJWHZ+4BD3kB9UGOXNdg$$YMBeoaLD2+SA7JW7RbQjCv4+2QAnimgF9QV79dSK5+s","requiredRoles":[{"serviceKey":"gitlab","name":"user"}],"groupsServiceKeys":["gitlab"],"requirePkce":true,"allowedScopes":["openid","profile","email"]}]
  oidc-preview-tls:
    image: sha256:6769dc3a703c719c1d2756bda113659be28ae16cf0da58dd5fd823d6b9a050ea
    pull_policy: never
    container_name: wiseacct-sso-oidc-preview-tls
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:4443:4443"]
    volumes:
      - ./ops/oidc-preview.nginx.conf:/etc/nginx/nginx.conf:ro
      - ${WISEACCT_OIDC_PREVIEW_TLS_DIR:?Set the local preview certificate directory}:/preview-tls:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks: [fastapi-dev-network]

[project]
name = "wiseacct-sso-fastapi"
version = "0.1.0"
description = "PROVISIONAL FastAPI replacement foundation for WiseAcct SSO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "pyjwt[crypto]==2.13.0",
  "redis==7.4.1",
  "sqlalchemy[asyncio]==2.0.52",
  "structlog==26.1.0",
  "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
  "anyio==4.14.2",
  "hatchling==1.27.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiseacct_sso"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

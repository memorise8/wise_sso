<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="admin-csrf" content="__ADMIN_CSRF__">
  <title>사용자 상세 | Wise SSO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/assets/admin-theme.js?v=20261111-theme"></script>
  <link rel="stylesheet" href="/assets/admin-dashboard.css?v=20261113-detail">
  <script src="/assets/admin-user-detail.js?v=20261113-detail" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="관리 메뉴">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">W</span>
        <div>
          <strong>Wise SSO</strong>
          <span>관리자</span>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="/oauth2/admin/dashboard#users" aria-current="page">사용자</a>
        <a class="nav-item" href="/oauth2/admin/dashboard#services">서비스 권한</a>
        <a class="nav-item" href="/oauth2/admin/dashboard#invites">직원 초대</a>
        <a class="nav-item" href="/oauth2/admin/dashboard#external">외부 계정</a>
        <a class="nav-item" href="/oauth2/admin/dashboard#audit">감사 로그</a>
      </nav>
      <div class="sidebar-foot">
        <div class="theme-switch" role="group" aria-label="화면 테마">
          <button type="button" data-theme-choice="system" aria-pressed="true">자동</button>
          <button type="button" data-theme-choice="light" aria-pressed="false">밝게</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">어둡게</button>
        </div>
      </div>
    </aside>

    <main class="admin-shell detail-page">
      <header class="topbar">
        <div>
          <a class="back-link" href="/oauth2/admin/dashboard#users">← 사용자 목록</a>
          <h1 id="detail-title">사용자 상세</h1>
        </div>
      </header>
      <p class="detail-status" id="detail-status" role="status">사용자 정보를 불러오는 중입니다.</p>
      <div class="detail-grid">
        <section class="panel" id="detail-profile" aria-label="기본 정보"></section>
        <section class="panel" id="detail-roles" aria-label="역할"></section>
        <section class="panel" id="detail-access" aria-label="로그인 가능 서비스"></section>
        <section class="panel" id="detail-sessions" aria-label="살아 있는 세션"></section>
      </div>
      <section class="panel" id="detail-last-login" aria-label="서비스별 마지막 로그인"></section>
      <section class="panel" id="detail-history" aria-label="최근 로그인 이력"></section>
      <section class="panel" id="detail-audit" aria-label="대상 사용자 감사 기록"></section>
    </main>
  </div>
</body>
</html>

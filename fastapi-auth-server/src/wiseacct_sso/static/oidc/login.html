<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>WiseAcct SSO 로그인</title>
    <link rel="stylesheet" href="/assets/auth.css">
    <link rel="stylesheet" href="/oauth2/assets/login.css">
  </head>
  <body>
    <main class="oidc-shell">
      <section class="oidc-panel" aria-labelledby="oidc-title">
        <p class="oidc-kicker">WISEACCT SSO</p>
        <h1 id="oidc-title">계속하려면 로그인하세요</h1>
        <p class="oidc-summary">요청한 내부 서비스로 안전하게 돌아갑니다.</p>
        {{ERROR_BLOCK}}
        <form method="post" action="/oauth2/login" autocomplete="on">
          <input type="hidden" name="transaction" value="{{TRANSACTION}}">
          <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" autocomplete="username" required maxlength="320">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
          <button type="submit">로그인</button>
        </form>
        {{PROVIDER_BLOCK}}
      </section>
    </main>
  </body>
</html>

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: "4000"
      DATABASE_URL: "postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD before starting app}@postgres:5432/${AUTH_DB_NAME:-auth_db}"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "${AUTH_HTTP_HOST:-127.0.0.1}:${AUTH_HTTP_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${AUTH_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_ADMIN_PASSWORD:?Set AUTH_DB_ADMIN_PASSWORD before starting postgres}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD before starting postgres}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-5432}:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
      - ./ops/init-local-postgres.sh:/docker-entrypoint-initdb.d/10-auth-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${AUTH_DB_USER:-auth_user}\" -d \"$${AUTH_DB_NAME:-auth_db}\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  auth-postgres-data:

events {}
http {
  access_log off;
  server_tokens off;
  ssl_certificate /certs/tls.crt;
  ssl_certificate_key /certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server {
    listen 4444 ssl;
    location / {
      proxy_pass http://app:4001;
      proxy_set_header Host $http_host;
    }
  }
  server {
    listen 4445 ssl;
    location / {
      proxy_pass http://dummy-customer:8000;
      proxy_set_header Host $http_host;
    }
  }
  server {
    listen 4446 ssl;
    location / {
      proxy_pass http://dummy-staff:8000;
      proxy_set_header Host $http_host;
    }
  }
}
